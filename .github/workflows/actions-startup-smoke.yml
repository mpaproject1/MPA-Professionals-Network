name: Actions runner startup diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub-hosted runner can start
        run: |
          set -eu
          echo "GitHub Actions runner started successfully."
          echo "Commit: $GITHUB_SHA"
          test -n "$GITHUB_REPOSITORY"

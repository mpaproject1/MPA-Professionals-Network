name: Pre-deployment backend source package (manual)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact Git branch, tag, or commit to package for review"
        required: true
        default: "ux/p0-navigation-and-org-privacy"
        type: string

permissions:
  contents: read

concurrency:
  group: mpa-predeployment-backend-package
  cancel-in-progress: false

jobs:
  package-and-validate:
    name: Package backend source only (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Select backend source files only
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git ls-files -z | python3 -c '
          import os, sys
          paths = sys.stdin.buffer.read().split(b"\0")
          selected = []
          allowed_roots = (b"src/", b"scripts/", b"db/migrations/", b"tests/", b"test/", b"config/")
          allowed_files = {b"server.js", b"package.json", b"package-lock.json", b"npm-shrinkwrap.json"}
          for path in paths:
              if not path:
                  continue
              base = os.path.basename(path).lower()
              if path in allowed_files or any(path.startswith(root) for root in allowed_roots):
                  if any(token in base for token in (b".env", b"secret", b"credential", b"private_key", b"id_rsa")):
                      continue
                  selected.append(path)
          if b"server.js" not in selected or b"package.json" not in selected:
              raise SystemExit("Required backend entrypoint/package manifest not found")
          if not any(p.startswith(b"db/migrations/") and p.endswith(b".sql") for p in selected):
              raise SystemExit("No tracked SQL migrations found; refusing incomplete package")
          sys.stdout.buffer.write(b"\0".join(selected) + b"\0")
          ' > "$RUNNER_TEMP/backend-files.list"

          grep -zqx 'server.js' "$RUNNER_TEMP/backend-files.list"
          grep -zqx 'package.json' "$RUNNER_TEMP/backend-files.list"

      - name: Package source and record revision
        id: package
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(cat "$RUNNER_TEMP/source-commit.txt")"
          archive="$RUNNER_TEMP/mpa-backend-predeployment-\${SOURCE_COMMIT}-\${GITHUB_RUN_ID}.tar.gz"
          manifest="$RUNNER_TEMP/mpa-backend-predeployment-\${SOURCE_COMMIT}-\${GITHUB_RUN_ID}.manifest.txt"
          checksum="$archive.sha256"
          tar --null -T "$RUNNER_TEMP/backend-files.list" -czf "$archive"
          python3 - "$RUNNER_TEMP/backend-files.list" "$manifest" "$SOURCE_COMMIT" "$SOURCE_REF" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$archive" <<'PY'
          import hashlib, sys
          files_path, manifest_path, commit, ref, repo, run_id, archive = sys.argv[1:]
          paths = [p for p in open(files_path, "rb").read().split(b"\0") if p]
          migrations = [p for p in paths if p.startswith(b"db/migrations/") and p.endswith(b".sql")]
          digest = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          with open(manifest_path, "w", encoding="utf-8") as out:
              out.write(f"repository={repo}\nsource_commit={commit}\nsource_ref={ref}\nworkflow_run_id={run_id}\n")
              out.write(f"tracked_backend_file_count={len(paths)}\nsql_migration_count={len(migrations)}\narchive_sha256={digest}\n")
          PY
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" > "$(basename "$checksum")")
          if tar -tzf "$archive" | grep -E '(^|/)(\.env([^/]*)?|node_modules)(/|$)|(^|/)web/|(^|/)\.git/' ; then
            echo "Unsafe or out-of-scope content found in archive."
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Store package as GitHub Actions artifact only
        uses: actions/upload-artifact@v4
        with:
          name: mpa-backend-predeployment-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.manifest }}
          retention-days: 7
          if-no-files-found: error

      - name: Confirm pre-deployment boundary
        if: success()
        run: |
          echo "Backend source package and manifest stored in GitHub Actions only."
          echo "No cPanel/SSH credentials are read; no remote upload, application restart, database migration, or deployment occurs."

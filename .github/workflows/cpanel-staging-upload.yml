name: Pre-deployment portal build (manual)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git branch, tag, or commit to build and validate"
        required: true
        default: "ux/p0-navigation-and-org-privacy"
        type: string

permissions:
  contents: read

concurrency:
  group: mpa-predeployment-portal-build
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build and validate only (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --include-workspace-root

      - name: Build portal
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run web:build

      - name: Validate production build and API rewrite
        working-directory: web
        run: |
          set -euo pipefail
          test -s .next/BUILD_ID
          test -s .next/routes-manifest.json
          test -s .next/build-manifest.json
          node <<'NODE'
          const fs = require("node:fs");
          const routes = JSON.parse(fs.readFileSync(".next/routes-manifest.json", "utf8"));
          const rewrites = Array.isArray(routes.rewrites)
            ? routes.rewrites
            : [
                ...(routes.rewrites?.beforeFiles ?? []),
                ...(routes.rewrites?.afterFiles ?? []),
                ...(routes.rewrites?.fallback ?? []),
              ];
          const expected = rewrites.some((r) =>
            r.source === "/api/:path*" &&
            r.destination === "https://api.muslimprofession.org/api/:path*"
          );
          if (!expected) {
            console.error("Expected production /api rewrite was not found.");
            process.exit(1);
          }
          console.log("Build output and production API rewrite verified.");
          NODE

      - name: Package a local review artifact
        id: package
        working-directory: web
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mpa-web-predeployment-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
          tar -czf "$archive" .next next.config.js
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" > "$archive.sha256")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Store artifact in GitHub Actions only
        uses: actions/upload-artifact@v4
        with:
          name: mpa-web-predeployment-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          retention-days: 14
          if-no-files-found: error

      - name: Confirm pre-deployment boundary
        if: success()
        run: |
          echo "Build and route validation passed for source revision: $GITHUB_SHA"
          echo "Artifact is stored in GitHub Actions only."
          echo "No cPanel/SSH credentials are read; no remote upload, restart, migration, or deployment occurs."

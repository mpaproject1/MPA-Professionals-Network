name: PR Quality - pre-deployment checks

on:
  pull_request:
    branches:
      - main
      - ux/p0-navigation-and-org-privacy
      - feat/serve-community-impact-workflows
      - feat/serve-community-g5-reconciled
      - feat/serve-community-g6-reconciled
  push:
    branches:
      - main
      - reconciliation/holistic-gates
      - feat/workstream-3-progress-members-workspace
      - feat/membership-command-center-card-pdf
      - feat/serve-community-impact-workflows
      - feat/serve-community-g5-reconciled
      - feat/serve-community-g6-reconciled
      - feat/serve-community-g7-acceptance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint application and test sources (collect all diagnostics)
        id: lint_validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-diagnostics
          npx --yes @biomejs/biome@2.2.4 check --max-diagnostics=5000 --formatter-enabled=false web/app web/components web/lib web/server.js web/next.config.js web/tailwind.config.ts src test e2e scripts server.js 2>&1 | tee ci-diagnostics/biome.log
          status=${PIPESTATUS[0]}
          echo "Biome exit code: $status"
          exit "$status"
      - name: Upload complete Biome diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biome-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/biome.log
          if-no-files-found: warn
          retention-days: 14
      - name: Fail lint job after collecting diagnostics
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint_validation.outcome }}
        run: |
          echo "Biome validation: $LINT_OUTCOME"
          test "$LINT_OUTCOME" = success

  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check web application (collect all diagnostics)
        id: typecheck_validation
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-diagnostics
          npx --no-install tsc --noEmit --pretty false -p web/tsconfig.json 2>&1 | tee ci-diagnostics/typescript.log
          status=${PIPESTATUS[0]}
          echo "TypeScript exit code: $status"
          exit "$status"
      - name: Upload complete TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-diagnostics/typescript.log
          if-no-files-found: warn
          retention-days: 14
      - name: Fail type-check job after collecting diagnostics
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck_validation.outcome }}
        run: |
          echo "TypeScript validation: $TYPECHECK_OUTCOME"
          test "$TYPECHECK_OUTCOME" = success

  backend-tests:
    name: Backend tests (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mpa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mpa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mpa_test
      JWT_SECRET: mpa-ci-only-jwt-secret-at-least-32-characters-long
      DB_POOL_MAX: 5
      MIGRATION_CHECK_EXPECTED_DATABASE: mpa_test
      MIGRATION_CHECK_ALLOW_ROLLBACK: "YES"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Python report-file readers
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent PDF and spreadsheet readers
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 pypdf==5.9.0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify disposable database identity
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select current_database()')" = "mpa_test"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'select current_database(), current_user;'
      - name: Verify legacy-schema upgrade on a separate disposable PostgreSQL database
        id: legacy_upgrade
        continue-on-error: true
        env:
          UPGRADE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mpa_upgrade_test
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mpa_upgrade_test'
          DATABASE_URL="$UPGRADE_DATABASE_URL" bash scripts/ci-migration-upgrade.sh
      - name: Apply repository migrations to disposable CI database
        id: apply_migrations
        continue-on-error: true
        run: npm run migrate
      - name: Verify migration compatibility and run every backend test file (collect all failures)
        id: backend_validation
        continue-on-error: true
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          MIGRATION_STATUS=0
          TEST_STATUS=0

          echo "=== Rollback-only migration compatibility audit ==="
          npm run check:migrations:rollback || MIGRATION_STATUS=$?

          echo
          echo "=== Complete backend test suite ==="
          mapfile -t TEST_FILES < <(find test tests -type f -name '*.test.js' -print 2>/dev/null | sort || true)
          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "No backend .test.js files found; refusing a false-green result."
            TEST_STATUS=1
          else
            printf 'Discovered %s backend test files.\\n' "${#TEST_FILES[@]}"
            printf '%s\\n' "${TEST_FILES[@]}"
            node --test "${TEST_FILES[@]}" || TEST_STATUS=$?
          fi

          echo
          echo "=== Backend validation summary ==="
          echo "Migration compatibility exit code: ${MIGRATION_STATUS}"
          echo "Backend test suite exit code:       ${TEST_STATUS}"
          if (( MIGRATION_STATUS != 0 || TEST_STATUS != 0 )); then
            exit 1
          fi

      - name: Fail the job after all backend diagnostics have been collected
        if: always()
        env:
          LEGACY_UPGRADE_OUTCOME: ${{ steps.legacy_upgrade.outcome }}
          APPLY_MIGRATIONS_OUTCOME: ${{ steps.apply_migrations.outcome }}
          BACKEND_VALIDATION_OUTCOME: ${{ steps.backend_validation.outcome }}
        run: |
          set -euo pipefail
          echo "Legacy upgrade: $LEGACY_UPGRADE_OUTCOME"
          echo "Apply migrations: $APPLY_MIGRATIONS_OUTCOME"
          echo "Backend validation: $BACKEND_VALIDATION_OUTCOME"
          if [[ "$LEGACY_UPGRADE_OUTCOME" != "success" || "$APPLY_MIGRATIONS_OUTCOME" != "success" || "$BACKEND_VALIDATION_OUTCOME" != "success" ]]; then
            echo "One or more backend validation stages failed; see all stage logs above." >&2
            exit 1
          fi

  production-build:
    name: Next.js build, browser acceptance and membership card PDF validation (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production application
        id: production_build
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          API_SERVER_BASE_URL: http://127.0.0.1:3000
        run: npm run web:build
      - name: Verify build output exists
        id: build_output
        if: always()
        continue-on-error: true
        working-directory: web
        run: |
          set -euo pipefail
          test -s .next/BUILD_ID
          test -s .next/routes-manifest.json
          test -s .next/build-manifest.json
          echo "Production build artifacts exist. No deployment or upload is performed."



  browser-acceptance:
    name: Browser acceptance (only after backend and production build pass)
    needs:
      - backend-tests
      - production-build
    if: ${{ needs.backend-tests.result == 'success' && needs.production-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Set up independent PDF parser for membership card print acceptance
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/pr-quality.yml
      - name: Install independent PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Start production server
        env:
          WEB_BASE_URL: http://127.0.0.1:3001
          PORT: 3001
        run: |
          set -euo pipefail
          npm run start --workspace @mpa/web > /tmp/mpa-web.log 2>&1 &
          echo "$!" > /tmp/mpa-web.pid
      - name: Verify production server readiness
        id: server_ready
        continue-on-error: true
        env:
          WEB_BASE_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl --connect-timeout 2 --max-time 5 -fsS "$WEB_BASE_URL/" >/dev/null; then
              echo "Production server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Production server did not become ready; browser tests will be skipped."
          cat /tmp/mpa-web.log || true
          exit 1
      - name: Run browser acceptance only when server is ready
        id: browser_acceptance
        if: ${{ steps.server_ready.outcome == 'success' }}
        env:
          WEB_BASE_URL: http://127.0.0.1:3001
          PORT: 3001
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: |
          set -euo pipefail
          echo "=== Browser acceptance: run every selected spec and collect every failure ==="
          mkdir -p test-results playwright-report
          npx playwright test \
            e2e/support-bot-movement.spec.js \
            e2e/ui-guide-tour.spec.js \
            e2e/homepage-institutional-ux.spec.js \
            e2e/membership-card-print.spec.js \
            e2e/registration-human-verification.spec.js \
            e2e/network-plus-discovery.spec.js \
            e2e/network-plus-requests.spec.js \
            e2e/serve-community-separation.spec.js \
            e2e/workspace-app-ux.spec.js \
            e2e/organization-workspace.spec.js \
            --max-failures=0 \
            --reporter=list,html,json
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/mpa-web.pid ]; then
            kill "$(cat /tmp/mpa-web.pid)" 2>/dev/null || true
          fi
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            /tmp/mpa-web.log
          if-no-files-found: warn
          retention-days: 14
      - name: Fail if server readiness or browser acceptance failed
        if: always()
        env:
          SERVER_READY_OUTCOME: ${{ steps.server_ready.outcome }}
          BROWSER_ACCEPTANCE_OUTCOME: ${{ steps.browser_acceptance.outcome }}
        run: |
          set -euo pipefail
          echo "Production server readiness: $SERVER_READY_OUTCOME"
          echo "Browser acceptance: $BROWSER_ACCEPTANCE_OUTCOME"
          if [[ "$SERVER_READY_OUTCOME" != "success" || "$BROWSER_ACCEPTANCE_OUTCOME" != "success" ]]; then
            echo "Browser acceptance did not complete successfully." >&2
            exit 1
          fi



# Browser role journeys are temporarily excluded from required PR CI because the
# repository has no isolated staging URL, seeded role accounts, or private-resource
# fixtures configured. Keep e2e/p2-role-journeys.spec.js; re-enable this job after
# those non-production fixtures are provisioned. Do not substitute production data.


name: PR Quality - pre-deployment checks

on:
  pull_request:
    branches: [main, ux/p0-navigation-and-org-privacy]
  push:
    branches:
      - main
      - reconciliation/holistic-gates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint application and test sources
        run: npx --yes @biomejs/biome@2.2.4 check --max-diagnostics=5000 --formatter-enabled=false web/app web/components web/lib web/server.js web/next.config.js web/tailwind.config.ts src test e2e scripts server.js

  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check web application
        run: npx --no-install tsc --noEmit --pretty false -p web/tsconfig.json

  backend-tests:
    name: Backend tests (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mpa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mpa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mpa_test
      JWT_SECRET: mpa-ci-only-jwt-secret-at-least-32-characters-long
      DB_POOL_MAX: 5
      MIGRATION_CHECK_EXPECTED_DATABASE: mpa_test
      MIGRATION_CHECK_ALLOW_ROLLBACK: "YES"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify disposable database identity
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c 'select current_database()')" = "mpa_test"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'select current_database(), current_user;'
      - name: Verify legacy-schema upgrade on a separate disposable PostgreSQL database
        env:
          UPGRADE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mpa_upgrade_test
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mpa_upgrade_test'
          DATABASE_URL="$UPGRADE_DATABASE_URL" bash scripts/ci-migration-upgrade.sh
      - name: Apply repository migrations to disposable CI database
        run: npm run migrate
      - name: Verify migration compatibility in rollback-only transaction
        run: npm run check:migrations:rollback
      - name: Run every backend test file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TEST_FILES < <(find test tests -type f -name '*.test.js' -print 2>/dev/null | sort || true)
          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "No backend .test.js files found; refusing a false-green result."
            exit 1
          fi
          printf 'Discovered %s backend test files.\n' "${#TEST_FILES[@]}"
          printf '%s\n' "${TEST_FILES[@]}"
          node --test "${TEST_FILES[@]}"

  production-build:
    name: Next.js production build (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          API_SERVER_BASE_URL: http://127.0.0.1:3000
        run: npm run web:build
      - name: Verify build output exists
        working-directory: web
        run: |
          set -euo pipefail
          test -s .next/BUILD_ID
          test -s .next/routes-manifest.json
          test -s .next/build-manifest.json
          echo "Production build artifacts exist. No deployment or upload is performed."

  browser-role-journeys:
    name: Playwright role and permission journeys (non-production only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # This gate intentionally fails closed when isolated test configuration is absent.
    env:
      WEB_BASE_URL: ${{ vars.MPA_E2E_BASE_URL }}
      MPA_E2E_ROLE_JOURNEYS: "1"
      MPA_E2E_ALLOW_MUTATIONS: ${{ vars.MPA_E2E_ALLOW_MUTATIONS }}
      MPA_E2E_NON_MEMBER_EMAIL: ${{ secrets.MPA_E2E_NON_MEMBER_EMAIL }}
      MPA_E2E_NON_MEMBER_PASSWORD: ${{ secrets.MPA_E2E_NON_MEMBER_PASSWORD }}
      MPA_E2E_ACTIVE_MEMBER_EMAIL: ${{ secrets.MPA_E2E_ACTIVE_MEMBER_EMAIL }}
      MPA_E2E_ACTIVE_MEMBER_PASSWORD: ${{ secrets.MPA_E2E_ACTIVE_MEMBER_PASSWORD }}
      MPA_E2E_SERVICE_PROVIDER_EMAIL: ${{ secrets.MPA_E2E_SERVICE_PROVIDER_EMAIL }}
      MPA_E2E_SERVICE_PROVIDER_PASSWORD: ${{ secrets.MPA_E2E_SERVICE_PROVIDER_PASSWORD }}
      MPA_E2E_MENTOR_EMAIL: ${{ secrets.MPA_E2E_MENTOR_EMAIL }}
      MPA_E2E_MENTOR_PASSWORD: ${{ secrets.MPA_E2E_MENTOR_PASSWORD }}
      MPA_E2E_ORG_OWNER_EMAIL: ${{ secrets.MPA_E2E_ORG_OWNER_EMAIL }}
      MPA_E2E_ORG_OWNER_PASSWORD: ${{ secrets.MPA_E2E_ORG_OWNER_PASSWORD }}
      MPA_E2E_ORG_STAFF_EMAIL: ${{ secrets.MPA_E2E_ORG_STAFF_EMAIL }}
      MPA_E2E_ORG_STAFF_PASSWORD: ${{ secrets.MPA_E2E_ORG_STAFF_PASSWORD }}
      MPA_E2E_REVIEWER_EMAIL: ${{ secrets.MPA_E2E_REVIEWER_EMAIL }}
      MPA_E2E_REVIEWER_PASSWORD: ${{ secrets.MPA_E2E_REVIEWER_PASSWORD }}
      MPA_E2E_FINANCE_EMAIL: ${{ secrets.MPA_E2E_FINANCE_EMAIL }}
      MPA_E2E_FINANCE_PASSWORD: ${{ secrets.MPA_E2E_FINANCE_PASSWORD }}
      MPA_E2E_ADMIN_EMAIL: ${{ secrets.MPA_E2E_ADMIN_EMAIL }}
      MPA_E2E_ADMIN_PASSWORD: ${{ secrets.MPA_E2E_ADMIN_PASSWORD }}
      MPA_E2E_UNRELATED_PRIVATE_ORG_ID: ${{ secrets.MPA_E2E_UNRELATED_PRIVATE_ORG_ID }}
      MPA_E2E_UNRELATED_PRIVATE_FILE_ID: ${{ secrets.MPA_E2E_UNRELATED_PRIVATE_FILE_ID }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Require isolated non-production fixtures and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WEB_BASE_URL:-}" || { echo "::error::Configure repository variable MPA_E2E_BASE_URL to a dedicated non-production test deployment."; exit 1; }
          node --input-type=module -e 'const u=new URL(process.env.WEB_BASE_URL); if (!/^(localhost|127\\.0\\.0\\.1)$/.test(u.hostname) && !/(staging|stage|test|e2e|preview|dev)/i.test(u.hostname)) { console.error("Refusing browser tests: target hostname must clearly identify a non-production environment."); process.exit(1); }'
          for key in \
            MPA_E2E_NON_MEMBER_EMAIL MPA_E2E_NON_MEMBER_PASSWORD \
            MPA_E2E_ACTIVE_MEMBER_EMAIL MPA_E2E_ACTIVE_MEMBER_PASSWORD \
            MPA_E2E_SERVICE_PROVIDER_EMAIL MPA_E2E_SERVICE_PROVIDER_PASSWORD \
            MPA_E2E_MENTOR_EMAIL MPA_E2E_MENTOR_PASSWORD \
            MPA_E2E_ORG_OWNER_EMAIL MPA_E2E_ORG_OWNER_PASSWORD \
            MPA_E2E_ORG_STAFF_EMAIL MPA_E2E_ORG_STAFF_PASSWORD \
            MPA_E2E_REVIEWER_EMAIL MPA_E2E_REVIEWER_PASSWORD \
            MPA_E2E_FINANCE_EMAIL MPA_E2E_FINANCE_PASSWORD \
            MPA_E2E_ADMIN_EMAIL MPA_E2E_ADMIN_PASSWORD \
            MPA_E2E_UNRELATED_PRIVATE_ORG_ID MPA_E2E_UNRELATED_PRIVATE_FILE_ID; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Missing required isolated E2E secret: $key"; exit 1; fi
          done
          test "${MPA_E2E_ALLOW_MUTATIONS:-}" = "1" || { echo "::error::Set repository variable MPA_E2E_ALLOW_MUTATIONS=1 only after confirming this environment has disposable seeded data."; exit 1; }
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run real-browser role, permission, privacy and duplicate-submit journeys
        run: npx playwright test e2e/p2-role-journeys.spec.js --reporter=list
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-role-journeys-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
